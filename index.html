<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who's the Best? 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush-bg: #fff0f6;
    --pale-pink: #ffd6ea;
    --hot-pink: #ff5fa2;
    --deep-pink: #e2007a;
    --plum-ink: #5c1a3d;
    --white: #ffffff;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    color:var(--plum-ink);
    background: radial-gradient(circle at 20% 15%, #ffe4f1 0%, var(--blush-bg) 45%, #ffe9f4 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    overflow-x:hidden;
    position:relative;
  }

  /* drifting hearts background */
  .drift{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .drift span{
    position:absolute;
    bottom:-10%;
    font-size: 22px;
    color: var(--hot-pink);
    opacity:0.28;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.28; }
    90%{ opacity:0.22; }
    100%{ transform: translateY(-115vh) rotate(25deg); opacity:0; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 440px;
    background: var(--white);
    border-radius: 28px;
    padding: clamp(24px, 5vw, 40px);
    box-shadow: 0 24px 60px -18px rgba(226,0,122,0.35), 0 2px 8px rgba(226,0,122,0.08);
    text-align:center;
    animation: settle 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes settle{
    0%{ opacity:0; transform: translateY(18px) rotate(-2deg) scale(0.97); }
    100%{ opacity:1; transform: translateY(0) rotate(0deg) scale(1); }
  }

  .heart-meter{
    width:100px; height:90px;
    margin: 0 auto 6px;
    position:relative;
  }
  .heart-meter .shape{
    width:100px; height:90px;
    clip-path: path('M50 88 C20 65, 0 45, 0 28 C0 12, 14 0, 28 0 C40 0, 48 8, 50 20 C52 8, 60 0, 72 0 C86 0, 100 12, 100 28 C100 45, 80 65, 50 88 Z');
    background: var(--pale-pink);
    position:relative;
    overflow:hidden;
  }
  .heart-meter .fill{
    position:absolute; left:0; bottom:0; width:100%; height:0%;
    background: linear-gradient(180deg, #ff8fc0, var(--deep-pink));
    transition: height 0.8s cubic-bezier(.34,1.56,.64,1);
  }
  .heart-meter .fill::after{
    content:"";
    position:absolute; top:0; left:0; right:0; height:6px;
    background: rgba(255,255,255,0.5);
  }
  .score-label{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.06em;
    color: var(--deep-pink);
    text-transform:uppercase;
    margin-bottom: 18px;
  }

  h1.title{
    font-family:'Alex Brush', cursive;
    font-size: clamp(38px, 9vw, 52px);
    color: var(--deep-pink);
    margin: 0 0 4px;
    line-height:1;
  }
  .subtitle{
    font-size:14px;
    color:#a3557e;
    margin: 0 0 22px;
  }

  .eyebrow{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--hot-pink);
    margin-bottom:10px;
  }

  .question{
    font-size: clamp(19px, 4.5vw, 23px);
    font-weight:700;
    margin: 0 0 22px;
    line-height:1.35;
  }

  input[type="text"]{
    width:100%;
    padding: 14px 16px;
    font-family:'Quicksand', sans-serif;
    font-size:16px;
    font-weight:600;
    color: var(--plum-ink);
    border: 2px solid var(--pale-pink);
    border-radius: 16px;
    outline:none;
    background: #fffafc;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  input[type="text"]:focus{
    border-color: var(--hot-pink);
    box-shadow: 0 0 0 4px rgba(255,95,162,0.18);
  }
  input[type="text"].shake{
    animation: shake 0.45s ease;
    border-color: var(--deep-pink);
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(4px); }
  }

  button{
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:16px;
    border:none;
    border-radius: 999px;
    padding: 14px 28px;
    cursor:pointer;
    color: var(--white);
    background: linear-gradient(135deg, var(--hot-pink), var(--deep-pink));
    box-shadow: 0 10px 22px -8px rgba(226,0,122,0.55);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    margin-top: 16px;
    width:100%;
  }
  button:hover{ transform: translateY(-2px); box-shadow: 0 14px 26px -8px rgba(226,0,122,0.6); }
  button:active{ transform: translateY(0px) scale(0.98); }
  button:focus-visible, input:focus-visible{
    outline: 3px solid var(--deep-pink);
    outline-offset: 2px;
  }

  .ghost-btn{
    background: transparent;
    color: var(--deep-pink);
    border: 2px solid var(--pale-pink);
    box-shadow: none;
    margin-top: 12px;
  }
  .ghost-btn:hover{
    background: #fff5fa;
    transform: translateY(-2px);
    box-shadow: none;
  }

  .feedback{
    margin-top: 18px;
    display:none;
  }
  .feedback.show{ display:block; animation: popin 0.4s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes popin{
    0%{ opacity:0; transform: scale(0.85) rotate(-6deg); }
    100%{ opacity:1; transform: scale(1) rotate(-3deg); }
  }
  .stamp{
    display:inline-block;
    font-family:'Alex Brush', cursive;
    font-size: 30px;
    padding: 6px 22px;
    border: 3px solid currentColor;
    border-radius: 14px;
    transform: rotate(-3deg);
  }
  .stamp.correct{ color: var(--deep-pink); }
  .stamp.wrong{ color: #b23a63; }
  .feedback-sub{
    font-size:14px;
    font-weight:600;
    color:#8a3f61;
    margin-top:10px;
  }
  .answer-reveal{
    font-size:14px;
    color:#8a3f61;
    margin-top:6px;
  }
  .answer-reveal b{ color: var(--deep-pink); }

  .hidden{ display:none !important; }

  .final-emoji{ font-size:52px; margin-bottom:6px; }
  .final-score{
    font-size: 20px;
    font-weight:700;
    color: var(--deep-pink);
    margin: 4px 0 6px;
  }
  .final-msg{
    font-size:14px;
    color:#8a3f61;
    margin-bottom: 6px;
  }

  /* Shop styles */
  .bank-display{
    font-size:16px;
    font-weight:700;
    color: var(--deep-pink);
    margin: 8px 0 4px;
  }
  .shop-items{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin: 20px 0 16px;
  }
  .shop-item{
    background: #fff0f6;
    border: 2px solid var(--pale-pink);
    color: var(--deep-pink);
    border-radius: 999px;
    padding: 12px;
    font-weight:700;
    cursor:pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    font-family:'Quicksand', sans-serif;
    font-size:15px;
    box-shadow:none;
    margin-top:0;
    width:100%;
  }
  .shop-item:hover:not(:disabled){
    background: var(--pale-pink);
    transform: translateY(-1px);
  }
  .shop-item:disabled{
    opacity:0.5;
    cursor:not-allowed;
    background:#f3e3eb;
    border-color:#e8c6d6;
  }
  .shop-feedback{
    margin-top:12px;
    font-size:14px;
    font-weight:600;
    color:#8a3f61;
    min-height:20px;
  }

  /* Modal styles */
  .modal {
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 20px;
    max-width: 90%;
    max-height: 90%;
    position: relative;
    box-shadow: 0 0 30px rgba(226,0,122,0.5);
  }
  .modal-content img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 12px;
    display: block;
  }
  .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 28px;
    font-weight: bold;
    color: var(--deep-pink);
    cursor: pointer;
    background: none;
    border: none;
    line-height: 1;
    padding: 0;
    width: auto;
    margin: 0;
  }
  .close-btn:hover {
    color: var(--hot-pink);
  }

  @media (prefers-reduced-motion: reduce){
    .drift span{ animation: none; opacity:0.15; }
    .card{ animation: none; }
    .feedback.show{ animation: none; }
    input[type="text"].shake{ animation: none; }
  }
</style>
</head>
<body>

<div class="drift" id="drift" aria-hidden="true"></div>

<div class="card">

  <div class="heart-meter" aria-hidden="true">
    <div class="shape"><div class="fill" id="heartFill"></div></div>
  </div>
  <div class="score-label" id="scoreLabel">0 / 450 points</div>

  <!-- START SCREEN -->
  <div id="startScreen">
    <h1 class="title">Who's the Best?</h1>
    <p class="subtitle">A little quiz just for you 💕</p>
    <button id="startBtn">Let's play</button>
    <button id="shopBtnStart" class="ghost-btn">Open shop</button>
    <p class="subtitle bank-display" id="bankStartDisplay">Good Girl Points: 0</p>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="hidden">
    <div class="eyebrow" id="progressLabel">Question 1 of 15</div>
    <p class="question" id="questionText"></p>
    <input type="text" id="answerInput" placeholder="Type your answer..." autocomplete="off">
    <button id="submitBtn">Submit answer</button>

    <div class="feedback" id="feedback">
      <div class="stamp" id="stamp"></div>
      <div class="feedback-sub" id="feedbackSub"></div>
      <div class="answer-reveal hidden" id="answerReveal"></div>
      <button id="actionBtn"></button>
    </div>

    <button id="shopBtnQuiz" class="ghost-btn">Open shop</button>
    <p class="subtitle bank-display" id="bankQuizDisplay">Good Girl Points: 0</p>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="hidden">
    <div class="final-emoji">🎉</div>
    <h1 class="title" style="font-size: clamp(30px,7vw,40px);">You did it!</h1>
    <div class="final-score" id="finalScore"></div>
    <div class="final-msg" id="finalMsg"></div>
    <button id="restartBtn">Play again</button>
    <button id="shopBtnEnd" class="ghost-btn">Open shop</button>
    <p class="subtitle bank-display" id="bankEndDisplay">Good Girl Points: 0</p>
  </div>

  <!-- SHOP SCREEN -->
  <div id="shopScreen" class="hidden">
    <div class="eyebrow">Good Girl Shop</div>
    <h1 class="title" style="font-size: clamp(30px,7vw,40px);">Spend your points</h1>
    <div class="bank-display" id="shopBankDisplay">Good Girl Points: 0</div>
    <div class="shop-items">
      <button class="shop-item" data-cost="20" data-name="Shawerma" data-gif-key="shawerma">Shawerma – 20 points</button>
      <button class="shop-item" data-cost="10" data-name="Mango milch" data-gif-key="mango">Mango milch – 10 points</button>
      <button class="shop-item" data-cost="40" data-name="Kunafa" data-gif-key="kunafa">Kunafa – 40 points</button>
      <button class="shop-item" data-cost="100" data-name="A hug" data-gif-key="hug">A hug – 100 points</button>
    </div>
    <button id="shopBackBtn" class="ghost-btn">Back</button>
    <div class="shop-feedback" id="shopFeedback"></div>
  </div>

</div>

<!-- GIF Modal -->
<div id="gifModal" class="modal hidden">
  <div class="modal-content">
    <button class="close-btn" id="closeModalBtn">&times;</button>
    <img id="modalGif" src="" alt="Reward GIF">
  </div>
</div>

<script>
  // ---- background drifting hearts ----
  const driftEl = document.getElementById('drift');
  const heartChars = ['💗','💕','💖','♡'];
  for (let i = 0; i < 14; i++){
    const s = document.createElement('span');
    s.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.animationDuration = (10 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    s.style.fontSize = (16 + Math.random()*18) + 'px';
    driftEl.appendChild(s);
  }

  // ---- quiz data ----
  function normalize(str){
    return str.toLowerCase()
      .replace(/ï/g, 'i')            // handle "ïam"
      .replace(/[^a-z0-9\s]/g, '')   // remove punctuation and apostrophes
      .trim();
  }

  function makeCheck(descriptors){
    const descList = Array.isArray(descriptors) ? descriptors : [descriptors];
    return (ans) => {
      const n = normalize(ans);
      if (n.includes('roya')) return true;

      const selfRegex = /\b(im|iam|i am)\b/;
      if (selfRegex.test(n)) {
        const rest = n.replace(/\b(im|iam|i am)\b/g, '').trim();
        // accepts just "I am" / "I'm" / "iam" / "im"
        if (!rest) return true;
        // or accepts "I am the [descriptor]"
        if (descList.some(d => rest.includes(d))) return true;
      }
      return false;
    };
  }

  const questions = [
    {
      q: "Who's the prettiest girl ever?",
      check: makeCheck(['prettiest girl']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the smartest girl ever?",
      check: makeCheck(['smartest girl']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the kindest person ever?",
      check: makeCheck(['kindest person']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the loveliest person ever?",
      check: makeCheck(['loveliest person']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the most funny idiot ever?",
      check: makeCheck(['most funny idiot', 'funny idiot']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the smollest cat ever?",
      check: makeCheck(['smollest cat', 'smallest cat']),
      answer: "Roya 💕"
    },
    {
      q: "Who is the most hardworking cat ever?",
      check: makeCheck(['most hardworking', 'hardworking']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the idiot whom makes a difference to everyone's life?",
      check: makeCheck(['makes a difference', 'idiot']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the sweetest person ever?",
      check: makeCheck(['sweetest person']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the most amazing girl ever?",
      check: makeCheck(['most amazing girl', 'amazing girl']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the most adorable girl ever?",
      check: makeCheck(['most adorable girl', 'adorable girl']),
      answer: "Roya 💕"
    },
    {
      q: "whos the cutest prettiestttt princess?",
      check: makeCheck(['fine hot princess']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the most charming person ever?",
      check: makeCheck(['most charming person', 'charming person']),
      answer: "Roya 💕"
    },
    {
      q: " who has the purest soul in the world??",
      check: makeCheck(['sweetest thing']),
      answer: "Roya 💕"
    },
    {
      q: "Who's the most beautiful girl in the world?",
      check: makeCheck(['most beautiful girl', 'beautiful girl']),
      answer: "Roya 💕"
    }
  ];

  const POINTS_PER_Q = 30;
  const MAX_SCORE = questions.length * POINTS_PER_Q;

  let current = 0;
  let score = 0;
  let awaitingNext = false;

  // Good girl points bank (persists across plays)
  let goodGirlPoints = 0;
  try {
    const saved = localStorage.getItem('goodGirlPoints');
    if (saved) goodGirlPoints = parseInt(saved, 10) || 0;
  } catch(e) {}

  function saveBank(){
    try {
      localStorage.setItem('goodGirlPoints', goodGirlPoints);
    } catch(e) {}
  }

  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const endScreen = document.getElementById('endScreen');
  const shopScreen = document.getElementById('shopScreen');
  const progressLabel = document.getElementById('progressLabel');
  const questionText = document.getElementById('questionText');
  const answerInput = document.getElementById('answerInput');
  const submitBtn = document.getElementById('submitBtn');
  const feedback = document.getElementById('feedback');
  const stamp = document.getElementById('stamp');
  const feedbackSub = document.getElementById('feedbackSub');
  const answerReveal = document.getElementById('answerReveal');
  const actionBtn = document.getElementById('actionBtn');
  const heartFill = document.getElementById('heartFill');
  const scoreLabel = document.getElementById('scoreLabel');
  const finalScore = document.getElementById('finalScore');
  const finalMsg = document.getElementById('finalMsg');
  const bankDisplays = [
    document.getElementById('bankStartDisplay'),
    document.getElementById('bankQuizDisplay'),
    document.getElementById('bankEndDisplay'),
    document.getElementById('shopBankDisplay')
  ];
  const shopFeedback = document.getElementById('shopFeedback');
  const gifModal = document.getElementById('gifModal');
  const modalGif = document.getElementById('modalGif');
  const closeModalBtn = document.getElementById('closeModalBtn');

  // Image/GIF configuration
  const gifSets = {
    shawerma: ['shawerma.jpg'],
    mango: ['bannanmilch.jpg'],
    kunafa: ['kunafa.jpg'],
    hug: ['hug.gif']
  };

  // Track current index for each category
  let gifCycleIndex = {
    shawerma: 0,
    mango: 0,
    kunafa: 0,
    hug: 0
  };

  function getNextGif(key){
    const set = gifSets[key];
    if (!set || set.length === 0) return '';
    const gif = set[gifCycleIndex[key] % set.length];
    gifCycleIndex[key] = (gifCycleIndex[key] + 1) % set.length;
    return gif;
  }

  function updateMeter(){
    const pct = Math.min(100, (score / MAX_SCORE) * 100);
    heartFill.style.height = pct + '%';
    scoreLabel.textContent = score + ' / ' + MAX_SCORE + ' points';
  }

  function updateBankDisplays(){
    const text = 'Good Girl Points: ' + goodGirlPoints;
    bankDisplays.forEach(el => { if (el) el.textContent = text; });
    document.querySelectorAll('.shop-item').forEach(btn => {
      const cost = parseInt(btn.dataset.cost, 10);
      btn.disabled = goodGirlPoints < cost;
    });
  }

  function renderQuestion(){
    const item = questions[current];
    progressLabel.textContent = 'Question ' + (current + 1) + ' of ' + questions.length;
    questionText.textContent = item.q;
    answerInput.value = '';
    answerInput.classList.remove('shake');
    feedback.classList.remove('show');
    answerReveal.classList.add('hidden');
    submitBtn.classList.remove('hidden');
    answerInput.classList.remove('hidden');
    awaitingNext = false;
    setTimeout(() => answerInput.focus(), 50);
  }

  function showCorrect(){
    score += POINTS_PER_Q;
    goodGirlPoints += POINTS_PER_Q;
    saveBank();
    updateMeter();
    updateBankDisplays();
    stamp.textContent = 'Correct, good girl 💕';
    stamp.className = 'stamp correct';
    feedbackSub.textContent = 'You got ' + POINTS_PER_Q + ' points!';
    answerReveal.classList.add('hidden');
    feedback.classList.add('show');
    submitBtn.classList.add('hidden');
    answerInput.classList.add('hidden');
    actionBtn.textContent = current === questions.length - 1 ? 'See my score' : 'Next question';
    awaitingNext = true;
    actionBtn.focus();
  }

  function showWrong(){
    stamp.textContent = 'Bad girl 😔';
    stamp.className = 'stamp wrong';
    feedbackSub.textContent = 'Not quite — try again!';
    answerReveal.innerHTML = 'The right answer is <b>' + questions[current].answer + '</b>';
    answerReveal.classList.remove('hidden');
    feedback.classList.add('show');
    answerInput.classList.add('shake');
    setTimeout(() => answerInput.classList.remove('shake'), 450);
    actionBtn.textContent = 'Try again';
    awaitingNext = false;
    answerInput.focus();
  }

  function handleSubmit(){
    const val = answerInput.value.trim();
    if (!val) { answerInput.focus(); return; }
    if (questions[current].check(val)){
      showCorrect();
    } else {
      showWrong();
    }
  }

  function handleAction(){
    if (awaitingNext){
      current++;
      if (current >= questions.length){
        showEnd();
      } else {
        renderQuestion();
      }
    } else {
      feedback.classList.remove('show');
      submitBtn.classList.remove('hidden');
      answerInput.classList.remove('hidden');
      answerInput.value = '';
      answerInput.focus();
    }
  }

  function showEnd(){
    quizScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    updateBankDisplays();
    finalScore.textContent = 'You scored ' + score + ' / ' + MAX_SCORE + ' points!';
    finalMsg.textContent = score === MAX_SCORE
      ? "Perfect score — you clearly know the answer to everything 💕"
      : "Not bad! Play again for a perfect score 💗";
    finalMsg.textContent += ' You earned ' + score + ' good girl points! Balance: ' + goodGirlPoints + '.';
  }

  function restart(){
    current = 0;
    score = 0;
    updateMeter();
    endScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    renderQuestion();
  }

  let shopReturnScreen = 'startScreen';
  function openShop(returnScreen){
    shopReturnScreen = returnScreen;
    document.getElementById(returnScreen).classList.add('hidden');
    shopScreen.classList.remove('hidden');
    updateBankDisplays();
  }

  function closeShop(){
    shopScreen.classList.add('hidden');
    document.getElementById(shopReturnScreen).classList.remove('hidden');
  }

  function purchaseItem(btn){
    const cost = parseInt(btn.dataset.cost, 10);
    const name = btn.dataset.name;
    const gifKey = btn.dataset.gifKey;
    if (goodGirlPoints >= cost){
      goodGirlPoints -= cost;
      saveBank();
      updateBankDisplays();
      shopFeedback.textContent = `You bought "${name}"!`;
      // Get the image/GIF for the item
      const gif = getNextGif(gifKey);
      modalGif.src = gif;
      gifModal.classList.remove('hidden');
    } else {
      shopFeedback.textContent = `Not enough points for ${name}. You need ${cost - goodGirlPoints} more points.`;
    }
  }

  // Close modal
  function closeModal(){
    gifModal.classList.add('hidden');
    modalGif.src = ''; // clear src to stop any animation
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');
    renderQuestion();
  });

  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('shopBtnStart').addEventListener('click', () => openShop('startScreen'));
  document.getElementById('shopBtnQuiz').addEventListener('click', () => openShop('quizScreen'));
  document.getElementById('shopBtnEnd').addEventListener('click', () => openShop('endScreen'));
  document.getElementById('shopBackBtn').addEventListener('click', closeShop);

  submitBtn.addEventListener('click', handleSubmit);
  actionBtn.addEventListener('click', handleAction);

  document.querySelectorAll('.shop-item').forEach(btn => {
    btn.addEventListener('click', () => purchaseItem(btn));
  });

  closeModalBtn.addEventListener('click', closeModal);
  // Close modal if clicked outside the content
  gifModal.addEventListener('click', (e) => {
    if (e.target === gifModal) closeModal();
  });

  answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      if (!submitBtn.classList.contains('hidden')) handleSubmit();
    }
  });

  updateMeter();
  updateBankDisplays();
</script>

</body>
</html>
